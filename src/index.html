<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  Sacred Timeline — a personal Marvel watch tracker.
  One self-contained file: no build step, no dependencies, no network needed.

  How it is laid out, in order:
    head          meta, icons, and the whole stylesheet
    body          background layers, then the page itself
    script        DATA        the 62 titles and their ordering keys
                  state       what is watched, rated, hidden, and preferences
                  storage     artifact storage if present, else localStorage
                  render      the list, phase bar, next-up and countdown
                  renderStats / renderSettings   the other two views
                  commands    search-box easter eggs

  Progress is saved per browser. Settings → Your data exports a backup or a
  short progress code for moving between devices.
-->

<meta name="description" content="A personal Marvel watch tracker: every film and series in six orderings, with watch history, ratings and stats.">

<meta name="theme-color" content="#05060a">

<title>Sacred Timeline — MCU watch tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">

</head>
<body>
<!-- Start-up intro: poster flip, Bifröst sweep, title. Driven by app.js (INTRO); hides itself after 6s if the script never runs. -->
<div id="intro" aria-hidden="true"><i class="intro-bg"></i><div class="intro-panels"></div><i class="intro-dots"></i><div class="intro-stage"><i class="intro-stack"></i><img class="intro-card" alt=""><i class="intro-tint"></i></div><i class="intro-flash"></i><i class="intro-beam"></i><i class="intro-beam glow"></i><div class="intro-logo"><span><b>Sacred Timeline</b></span></div><small class="intro-hint">tap to skip</small></div>
<noscript><p style="max-width:40em;margin:3em auto;padding:0 1.2em;color:#a4acc1;font:16px/1.6 system-ui,sans-serif">
This tracker needs JavaScript. Everything runs in your browser — nothing is sent anywhere.
</p></noscript>

<canvas id="stars"></canvas>
<div class="nebula a"></div>
<div class="nebula b"></div>
<div id="backdrop" aria-hidden="true"><i class="bd-fill"></i><i class="bd-sharp"></i></div>

<svg class="fxdefs" aria-hidden="true" focusable="false">
  <filter id="dust" x="-45%" y="-45%" width="190%" height="190%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.014 0.038" numOctaves="3" seed="5" result="noise"/>
    <feDisplacementMap id="dustMap" in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<div id="flash" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite"></div>

<div id="reactor" aria-hidden="true">
  <div class="disc"></div>
  <svg class="core" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <g class="r1" fill="none" stroke="#bdefff" stroke-width="1.1" opacity=".75">
      <circle cx="100" cy="100" r="86" stroke-dasharray="4 12"/>
    </g>
    <g class="r2" fill="none" stroke="#8fe6ff" stroke-width="2.4" opacity=".85">
      <circle cx="100" cy="100" r="70" stroke-dasharray="40 22"/>
    </g>
    <g class="r3" fill="none" stroke="#dff6ff" stroke-width="1" opacity=".6">
      <circle cx="100" cy="100" r="54" stroke-dasharray="2 8"/>
    </g>
    <circle cx="100" cy="100" r="38" fill="none" stroke="#bdefff" stroke-width="3.5" opacity=".9"/>
    <g class="r4" fill="none" stroke="#eaffff" stroke-width="1.6" opacity=".8">
      <path d="M100 68 L128 116 L72 116 Z"/>
    </g>
    <circle class="pip" cx="100" cy="100" r="17" fill="#f4feff"/>
  </svg>
</div>

<div class="wrap">
  <header>
    <div class="masthead">
      <div class="mast-text">
        <h1 class="title">Sacred Timeline</h1>
        <p class="sub">Every Marvel Studios film and series, in whatever order you want to take them. Colour returns to a title once you've watched it.</p>
      </div>
      <div class="tabs" role="tablist">
        <button id="tabList" role="tab" aria-selected="true">Timeline</button>
        <button id="tabStats" role="tab" aria-selected="false">Stats</button>
        <button id="tabSet" role="tab" aria-selected="false" aria-label="Settings">Settings</button>
      </div>
    </div>
    <div class="constellation" id="constellation"></div>
    <p class="tally" id="tally"></p>
    <p class="countdown" id="countdown" hidden></p>
    <div class="nextup" id="nextup" hidden></div>
  </header>

  <div class="controls" id="controls">
    <div class="field" id="qfield"><input type="search" id="q" placeholder="Search titles" autocomplete="off"><span class="hint">↵</span></div>
    <div class="filters"><!-- display:contents on desktop; a swipeable row on phones -->
    <select id="sort" aria-label="Order">
      <option value="release">Release order</option>
      <option value="chrono">Story chronology</option>
      <option value="sacred">Sacred Timeline</option>
      <option value="phase">By phase</option>
      <option value="saga">By saga</option>
      <option value="next">Unwatched first</option>
      <option value="short">Shortest first</option>
      <option value="long">Longest first</option>
      <option value="az">A to Z</option>
    </select>
    <select id="show" aria-label="Show">
      <option value="all">Everything</option>
      <option value="unseen">Not watched</option>
      <option value="seen">Watched</option>
      <option value="part">Part watched</option>
    </select>
    <select id="maxlen" aria-label="Time available">
      <option value="0">Any length</option>
      <option value="60">Under 1 hour</option>
      <option value="90">Under 1½ hours</option>
      <option value="120">Under 2 hours</option>
      <option value="150">Under 2½ hours</option>
      <option value="999">Over 2½ hours</option>
    </select>
    <label class="toggle"><input type="checkbox" id="series"> Series &amp; specials</label>
    </div>
  </div>

  <div class="filterbar" id="filterbar"></div>
  <div id="list"></div>
  <div id="statsview" hidden></div>
  <div id="settingsview" hidden></div>

  <footer>
    <span class="note"><kbd>/</kbd> search · <kbd>J</kbd><kbd>K</kbd> move · <kbd>X</kbd> watched · <kbd>Enter</kbd> open · <kbd>1</kbd>–<kbd>6</kbd> phase · <kbd>R</kbd> random</span>
    <div id="status"></div>
  </footer>
</div>

<script src="dev-loader.js"></script>
</body>
</html>
